<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AI VERITY – Xem bài của học sinh</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--tx:#0f1b36;--mut:#52617f;--ln:#d9e5f2;--cy:#19a7f0;--card:#f3f8fd}
@media(prefers-color-scheme:dark){:root{--bg:#0a1226;--tx:#e8eefb;--mut:#a3b1cf;--ln:#223256;--card:#10203f}}
*{box-sizing:border-box}
body{margin:0 auto;max-width:1000px;padding:16px;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,"Segoe UI",sans-serif}
h1{font-size:1.3rem;margin:0 0 4px}.sm{color:var(--mut);font-size:.86rem}
input,button{font:inherit;padding:9px 12px;border:1.5px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx)}
button{cursor:pointer;background:var(--cy);color:#04122e;border:0;font-weight:600}button.g{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar input{flex:1 1 200px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--ln)}
tr.r{cursor:pointer}tr.r:hover{background:var(--card)}
#detail{margin-top:18px;padding:14px;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
details{margin:2px 0}summary{cursor:pointer;font-weight:600}.in{margin-left:16px;border-left:2px solid var(--ln);padding-left:10px}
.kv{margin:2px 0;white-space:pre-wrap;word-break:break-word}.kv b{color:var(--cy)}
.err{color:#d64545}[hidden]{display:none!important}
</style>
</head>
<body>
<h1>AI VERITY – Xem bài của học sinh</h1>
<p class="sm">Trang dành cho admin. Không gắn liên kết đến trang này từ trang học sinh.</p>

<section id="login" hidden>
  <div class="bar">
    <input id="em" type="email" placeholder="Email admin" autocomplete="username">
    <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button id="go">Đăng nhập</button>
  </div>
  <p id="lerr" class="err"></p>
</section>

<section id="app" hidden>
  <div class="bar">
    <input id="q" placeholder="Lọc theo mã học sinh, ví dụ HS-AB12CD">
    <button class="g" id="rf">Tải lại</button>
    <button class="g" id="ej">Tải JSON</button>
    <button class="g" id="ec">Tải CSV</button>
    <button class="g" id="out">Đăng xuất</button>
  </div>
  <p class="sm" id="cnt"></p>
  <table><thead><tr><th>Mã học sinh</th><th>Lần lưu gần nhất</th><th>Số mục dữ liệu</th></tr></thead><tbody id="tb"></tbody></table>
  <div id="detail" hidden></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* Điền URL và khóa anon/publishable của Supabase (cùng giá trị với CFG trong index.html).
   KHÔNG dán service_role key. */
const CFG={url:'https://jjvghwhtovxisbndwkrj.supabase.co',key:'sb_publishable_Jf_7-KyK-v4891Z3W_dLQQ_m2l3_s0z'};

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('vi-VN');
let sb,rows=[];

/* Dữ liệu do học sinh nhập nên LUÔN được escape trước khi chèn vào trang. */
function tree(v,k,open){
  if(v===null||typeof v!=='object')return `<div class="kv"><b>${esc(k)}:</b> ${esc(v)}</div>`;
  const e=Array.isArray(v)?v.map((x,i)=>[i+1,x]):Object.entries(v);
  return `<details${open?' open':''}><summary>${esc(k)} <span class="sm">(${e.length})</span></summary><div class="in">${e.map(([a,b])=>tree(b,a,false)).join('')}</div></details>`;
}

function show(id){$('#login').hidden=id!=='login';$('#app').hidden=id!=='app'}

async function load(){
  show('app');$('#cnt').textContent='Đang tải...';
  const {data,error}=await sb.from('latest_snapshots').select('code,created_at,data').order('created_at',{ascending:false});
  if(error){$('#cnt').innerHTML='<span class="err">Không đọc được dữ liệu: '+esc(error.message)+'</span>';return}
  rows=data||[];draw();
}

function draw(){
  const f=$('#q').value.trim().toUpperCase();
  const list=rows.filter(r=>!f||r.code.includes(f));
  $('#cnt').textContent=list.length+' học sinh'+(f?' (đã lọc)':'');
  $('#tb').innerHTML=list.map(r=>`<tr class="r" data-c="${esc(r.code)}"><td>${esc(r.code)}</td><td>${esc(fmt(r.created_at))}</td><td>${Object.keys(r.data||{}).length}</td></tr>`).join('')||'<tr><td colspan="3" class="sm">Chưa có dữ liệu.</td></tr>';
}

async function detail(code){
  const box=$('#detail');box.hidden=false;box.textContent='Đang tải...';
  const {data,error}=await sb.from('student_snapshots').select('id,created_at,data').eq('code',code).order('created_at',{ascending:false}).limit(30);
  if(error){box.innerHTML='<span class="err">'+esc(error.message)+'</span>';return}
  const opts=data.map((r,i)=>`<option value="${i}">${esc(fmt(r.created_at))}${i===0?' (mới nhất)':''}</option>`).join('');
  box.innerHTML=`<h2 style="margin:0 0 8px;font-size:1.1rem">${esc(code)}</h2>
    <p class="sm">Chọn bản lưu: <select id="ver">${opts}</select></p><div id="tr"></div>`;
  const show1=()=>{$('#tr').innerHTML=tree(data[+$('#ver').value].data,'Dữ liệu',true)};
  $('#ver').onchange=show1;show1();box.scrollIntoView({behavior:'smooth'});
}

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const csvc=v=>'"'+String(v).replace(/"/g,'""')+'"';

if(!CFG.url||!CFG.key){
  show('login');$('#lerr').textContent='Chưa điền CFG.url và CFG.key ở đầu đoạn script.';
}else{
  sb=supabase.createClient(CFG.url,CFG.key);
  sb.auth.getSession().then(({data})=>data.session?load():show('login'));
  $('#go').onclick=async()=>{
    $('#lerr').textContent='';
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    if(error)$('#lerr').textContent='Đăng nhập thất bại: '+error.message;else load();
  };
  $('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
  $('#out').onclick=async()=>{await sb.auth.signOut();rows=[];$('#detail').hidden=true;show('login')};
  $('#rf').onclick=load;
  $('#q').oninput=draw;
  $('#tb').onclick=e=>{const tr=e.target.closest('tr.r');if(tr)detail(tr.dataset.c)};
  $('#ej').onclick=()=>download('hoc-sinh-moi-nhat.json',JSON.stringify(rows,null,2),'application/json');
  $('#ec').onclick=()=>download('hoc-sinh-moi-nhat.csv','\ufeffmã,thời điểm,dữ liệu\n'+rows.map(r=>[r.code,r.created_at,JSON.stringify(r.data)].map(csvc).join(',')).join('\n'),'text/csv');
}
</script>
</body>
</html>
